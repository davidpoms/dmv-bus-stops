<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manage pilot review leads</title><link rel="stylesheet" href="/static/dashboard.css"></head><body>
<main class="panel"><p><a href="/admin">Return to pilot dashboard</a></p><h1>Manage pilot review leads</h1>
<p>Owners may promote reviewers to review lead or return review leads to reviewer. Owner roles require the operator command.</p>
<div class="table-scroll"><table class="admin-table"><thead><tr><th>ID</th><th>Display name</th><th>Verified</th><th>Contributions</th><th>Recent contribution</th><th>Role</th><th>Action</th></tr></thead><tbody id="reviewers"></tbody></table></div>
<p id="status" role="status"></p></main><script>
const csrf={{ csrf_token|tojson }};
async function load(){const data=await fetch("/api/admin/reviewers").then(r=>r.json());const body=document.getElementById("reviewers");body.replaceChildren();data.reviewers.forEach(row=>{const tr=document.createElement("tr");[row.reviewer_id,row.display_name,row.verified?"Yes":"No",row.contribution_count,row.last_contribution_at||"None",row.role].forEach(value=>{const td=document.createElement("td");td.textContent=value;tr.appendChild(td);});const action=document.createElement("td");if(row.role!=="owner"){const target=row.role==="review_lead"?"reviewer":"review_lead";const button=document.createElement("button");button.textContent=target==="review_lead"?"Promote to review lead":"Return to reviewer";button.addEventListener("click",async()=>{if(!confirm(`Change ${row.display_name} to ${target.replace("_"," ")}?`))return;const response=await fetch(`/api/admin/reviewers/${row.reviewer_id}/role`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role:target,csrf_token:csrf})});const result=await response.json();document.getElementById("status").textContent=result.error||"Role updated.";if(response.ok)load();});action.appendChild(button);}else action.textContent="Operator-managed";tr.appendChild(action);body.appendChild(tr);});}load();
</script></body></html>
